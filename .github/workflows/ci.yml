name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  unit-tests:
    name: Unit Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install application and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run unit tests
        run: python -m pytest

      - name: Run coverage gate
        run: python tests/check_coverage.py

  code-scanning-quality:
    name: Code Scanning / Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff

      - name: Run Ruff static analysis
        run: python -m ruff check open_world_watch tests

  code-scanning-security:
    name: Code Scanning / Security
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . bandit

      - name: Run Bandit security scan
        run: python -m bandit -r open_world_watch -q

      - name: Initialize CodeQL
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/analyze@v3

      - name: Review dependency changes
        if: ${{ !github.event.repository.private && github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v5
